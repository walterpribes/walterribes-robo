name: Posts @walterribestrafego

on:
  schedule:
    # A cada 15 min, das 7h às 22h45 (Brasília). O GitHub pode atrasar; o robô publica o que estiver
    # na hora ou atrasado no dia, e nunca publica o mesmo post duas vezes.
    - cron: "*/15 10-23,0-1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = conferir token | dry-run = testar o próximo post sem publicar | publish = publicar o que está na hora"
        required: true
        default: check
        type: choice
        options: [check, dry-run, publish]
      date:
        description: "Opcional: publicar AGORA o post deste dia (ex.: 2026-11-10). Use com mode = publish."
        required: false
        default: ""
      time:
        description: "Opcional: horário do post (ex.: 18:00), quando houver mais de um no dia."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: posts-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          DAY: ${{ github.event.inputs.date }}
          HORA: ${{ github.event.inputs.time }}
        run: |
          ARGS=""
          [ -n "$DAY" ] && ARGS="$ARGS --date $DAY"
          [ -n "$HORA" ] && ARGS="$ARGS --time $HORA"
          case "$MODE" in
            check)   python postar.py --check ;;
            dry-run) python postar.py --dry-run $ARGS ;;
            *)       python postar.py $ARGS ;;
          esac
      - name: Registrar o que foi publicado
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicados.json 2>/dev/null)" ]; then
            git config user.name "walter-robo"
            git config user.email "walter-robo@users.noreply.github.com"
            git add publicados.json
            git commit -m "Registro de publicação $(TZ=America/Sao_Paulo date '+%F %H:%M')"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 5; done
          fi
